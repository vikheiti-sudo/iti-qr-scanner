<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITI Android QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f8;color:#202124}
.container{max-width:520px;margin:auto;padding:15px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #00000014}
h1{margin:0 0 6px;font-size:23px}.subtitle{color:#5f6368;font-size:14px;line-height:1.5}
#reader{width:100%;min-height:300px;border-radius:12px;overflow:hidden;background:#111}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:11px;font-size:16px;font-weight:bold}
.primary{background:#1a73e8;color:white}.secondary{background:#e8eaed;color:#202124}
.status{text-align:center;color:#5f6368;font-size:14px;line-height:1.5;margin-top:10px}
.error{display:none;background:#fce8e6;color:#b3261e;padding:14px;border-radius:10px;margin-top:15px;line-height:1.5}
.result{display:none;background:#e6f4ea;color:#137333;padding:14px;border-radius:10px;margin-top:15px;word-break:break-word}
.test{background:#f8f9fa;padding:12px;border-radius:10px;margin-top:12px;font-size:13px;line-height:1.7}.ok{color:#137333;font-weight:bold}.bad{color:#b3261e;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<div class="card"><h1>ITI Android QR Scanner</h1>
<div class="subtitle">Camera-only test for ITI Attendance Monitoring System 2026-27. Attendance is NOT written to the sheet in this test.</div></div>
<div class="card">
<video id="reader" autoplay playsinline muted
       style="width:100%;min-height:300px;border-radius:12px;
       background:#111;object-fit:cover;"></video>
<div id="status" class="status">Camera not started.</div>
<button id="startButton" class="primary" onclick="startScanner()">📷 Start Scanner</button>
<button id="stopButton" class="secondary" onclick="stopScanner()" style="display:none">Stop Scanner</button>
<div id="error" class="error"></div><div id="result" class="result"></div>
<div class="test">
<div><b>Secure context:</b> <span id="secureTest"></span></div>
<div><b>Camera API:</b> <span id="cameraTest"></span></div>
<div><b>Scanner library:</b> <span id="libraryTest"></span></div>
</div>
</div></div>
<script>
let scanner=null,scannerRunning=false,scanLocked=false;
function setStatus(m){document.getElementById("status").textContent=m}
function showError(m){let x=document.getElementById("error");x.textContent=m;x.style.display="block"}
function hideError(){let x=document.getElementById("error");x.textContent="";x.style.display="none"}
function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function showResult(m){let x=document.getElementById("result");x.innerHTML="<b>✅ QR DETECTED</b><br><br>"+esc(m);x.style.display="block"}
function test(id,ok,text){let x=document.getElementById(id);x.textContent=text;x.className=ok?"ok":"bad"}
function env(){
 test("secureTest",window.isSecureContext,window.isSecureContext?"YES":"NO");
 test("cameraTest",!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),
      navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?"AVAILABLE":"NOT AVAILABLE");
 test("libraryTest",typeof Html5Qrcode!=="undefined",typeof Html5Qrcode!=="undefined?"LOADED":"NOT LOADED");
}
async function startScanner(){
 hideError();document.getElementById("result").style.display="none";
 if(scannerRunning)return;
 if(!window.isSecureContext){showError("This page must be opened using HTTPS.");return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showError("Camera API is not available in this browser.");return}
 if(typeof Html5Qrcode==="undefined"){showError("QR scanner library did not load. Check internet.");return}
 scanLocked=false;setStatus("Requesting Android camera permission...");
 scanner=new Html5Qrcode("reader");
 const config={fps:10,qrbox:function(w,h){let s=Math.floor(Math.min(w,h)*.70);return{width:s,height:s}},aspectRatio:1.0,disableFlip:false};
 try{
   await scanner.start({facingMode:{exact:"environment"}},config,onScanSuccess,function(){});
   scannerRunning=true;document.getElementById("startButton").style.display="none";
   document.getElementById("stopButton").style.display="block";
   setStatus("✅ Rear camera active. Point at a student QR code.");
 }catch(e){
   console.error(e);scannerRunning=false;
   try{await scanner.clear()}catch(x){} scanner=null;
   let m="Unable to start the camera.";
   if(e&&e.name==="NotAllowedError")m="Camera permission was denied by the browser. Check Chrome → Site settings → Camera → Allow, then reload.";
   else if(e&&e.name==="NotFoundError")m="No camera was found on this device.";
   else if(e&&e.name==="NotReadableError")m="The camera is already being used by another app. Close other camera apps and try again.";
   else if(e&&e.name==="OverconstrainedError")m="The requested rear camera is not available. We will adjust camera selection next.";
   else if(e&&e.message)m=e.message;
   showError(m);setStatus("Camera could not be started.");
 }
}
async function stopScanner(){
 if(!scanner)return;
 try{if(scannerRunning)await scanner.stop()}catch(e){console.warn(e)}
 try{await scanner.clear()}catch(e){console.warn(e)}
 scanner=null;scannerRunning=false;
 document.getElementById("startButton").style.display="block";
 document.getElementById("stopButton").style.display="none";
 setStatus("Camera stopped.");
}
async function onScanSuccess(text){
 if(scanLocked)return;scanLocked=true;showResult(text);setStatus("QR successfully detected.");await stopScanner();
}
env();
</script>
</body>
</html>
