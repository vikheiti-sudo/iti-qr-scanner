<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITI Android Camera Test</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#202124;
}

.container{
  max-width:520px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #00000014;
}

h1{
  margin:0 0 8px;
  font-size:23px;
}

.subtitle{
  color:#5f6368;
  font-size:14px;
  line-height:1.5;
}

#reader{
  width:100%;
  height:320px;
  border-radius:12px;
  overflow:hidden;
  background:#111;
  object-fit:cover;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:11px;
  font-size:16px;
  font-weight:bold;
}

.primary{
  background:#1a73e8;
  color:white;
}

.secondary{
  background:#e8eaed;
  color:#202124;
}

.status{
  text-align:center;
  color:#5f6368;
  font-size:14px;
  line-height:1.5;
  margin-top:10px;
}

.error{
  display:none;
  background:#fce8e6;
  color:#b3261e;
  padding:14px;
  border-radius:10px;
  margin-top:15px;
  line-height:1.5;
}

.test{
  background:#f8f9fa;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  font-size:13px;
  line-height:1.8;
}

.ok{
  color:#137333;
  font-weight:bold;
}

.bad{
  color:#b3261e;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>ITI Android Camera Test</h1>

    <div class="subtitle">
      Camera-only test for ITI Attendance Monitoring System 2026-27.
      QR scanning and attendance are NOT being tested yet.
    </div>
  </div>

  <div class="card">

    <video
      id="reader"
      autoplay
      playsinline
      muted>
    </video>

    <div id="status" class="status">
      Camera not started.
    </div>

    <button
      id="startButton"
      class="primary"
      onclick="startCamera()">
      📷 Start Camera
    </button>

    <button
      id="stopButton"
      class="secondary"
      onclick="stopCamera()"
      style="display:none">
      Stop Camera
    </button>

    <div id="error" class="error"></div>

    <div class="test">

      <div>
        <b>Secure context:</b>
        <span id="secureTest"></span>
      </div>

      <div>
        <b>Camera API:</b>
        <span id="cameraTest"></span>
      </div>

      <div>
        <b>Browser:</b>
        <span id="browserTest"></span>
      </div>

      <div>
        <b>Camera permission:</b>
        <span id="permissionTest"></span>
      </div>

    </div>

  </div>

</div>

<script>

let cameraStream = null;


function setStatus(message){

  document.getElementById("status").textContent = message;

}


function showError(message){

  const box = document.getElementById("error");

  box.textContent = message;

  box.style.display = "block";

}


function hideError(){

  const box = document.getElementById("error");

  box.textContent = "";

  box.style.display = "none";

}


function test(id, ok, text){

  const element = document.getElementById(id);

  element.textContent = text;

  element.className = ok ? "ok" : "bad";

}


function runDiagnostics(){

  test(
    "secureTest",
    window.isSecureContext,
    window.isSecureContext ? "YES" : "NO"
  );


  const cameraAvailable =
    !!(
      navigator.mediaDevices &&
      navigator.mediaDevices.getUserMedia
    );


  test(
    "cameraTest",
    cameraAvailable,
    cameraAvailable ? "AVAILABLE" : "NOT AVAILABLE"
  );


  const isChrome =
    /Chrome/i.test(navigator.userAgent);


  test(
    "browserTest",
    isChrome,
    isChrome ? "Chrome detected" : "Other browser"
  );


  if(
    navigator.permissions &&
    navigator.permissions.query
  ){

    navigator.permissions
      .query({name:"camera"})
      .then(function(result){

        if(result.state === "granted"){

          test(
            "permissionTest",
            true,
            "GRANTED"
          );

        }
        else if(result.state === "prompt"){

          test(
            "permissionTest",
            true,
            "NOT ASKED YET"
          );

        }
        else{

          test(
            "permissionTest",
            false,
            "DENIED"
          );

        }

      })
      .catch(function(){

        test(
          "permissionTest",
          true,
          "CHECKED DURING START"
        );

      });

  }
  else{

    test(
      "permissionTest",
      true,
      "CHECKED DURING START"
    );

  }

}


async function startCamera(){

  hideError();

  if(!window.isSecureContext){

    showError(
      "HTTPS is required. This page is not running in a secure context."
    );

    return;
  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    showError(
      "Camera API is not available in this browser."
    );

    return;
  }


  setStatus(
    "Requesting Android camera permission..."
  );


  try{

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"environment"
        },

        audio:false

      });


    const video =
      document.getElementById("reader");


    video.srcObject =
      cameraStream;


    await video.play();


    document.getElementById(
      "startButton"
    ).style.display = "none";


    document.getElementById(
      "stopButton"
    ).style.display = "block";


    test(
      "permissionTest",
      true,
      "GRANTED"
    );


    setStatus(
      "✅ Android rear camera is ACTIVE."
    );

  }

  catch(error){

    console.error(
      "CAMERA ERROR:",
      error
    );


    let message =
      "Unable to start the camera.";


    if(error.name === "NotAllowedError"){

      message =
        "Camera permission was denied. " +
        "Open Chrome → Site settings → Camera → Allow, then reload this page.";

      test(
        "permissionTest",
        false,
        "DENIED"
      );

    }

    else if(error.name === "NotFoundError"){

      message =
        "No camera was found on this device.";

    }

    else if(error.name === "NotReadableError"){

      message =
        "The camera is already being used by another application. Close other camera apps.";

    }

    else if(error.name === "SecurityError"){

      message =
        "Camera access was blocked by browser security.";

    }

    else if(error.name === "OverconstrainedError"){

      message =
        "Rear-camera selection failed. We will test automatic camera selection next.";

    }

    else{

      message =
        error.name + ": " + error.message;

    }


    showError(message);


    setStatus(
      "Camera could not be started."
    );

  }

}


function stopCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(function(track){

        track.stop();

      });

    cameraStream = null;

  }


  const video =
    document.getElementById("reader");


  video.srcObject = null;


  document.getElementById(
    "startButton"
  ).style.display = "block";


  document.getElementById(
    "stopButton"
  ).style.display = "none";


  setStatus(
    "Camera stopped."
  );

}


runDiagnostics();

</script>

</body>
</html>
